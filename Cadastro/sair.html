<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Saindo...</title>

    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #00bfff, #b9d5f8);

            font-family: Arial, Helvetica, sans-serif;
        }

        /* CARD CENTRAL */
        .container {
            text-align: center;

            background: rgba(255, 255, 255, 0.15);

            padding: 40px;

            border-radius: 20px;

            backdrop-filter: blur(10px);

            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);

            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* GIF */
        .container img {
            width: 300px;

            border-radius: 15px;

            border: 5px solid rgb(194, 252, 252);

            box-shadow: 0 0 20px rgb(194, 252, 252);
            ;

            margin-bottom: 20px;
        }

        /* TEXTO */
        h1 {
            color: white;

            font-size: 40px;

            text-shadow: 0 0 15px rgba(0, 0, 0, 0.5);

            margin: 10px 0;
        }

        p {
            color: #e0f7ff;

            font-size: 18px;
        }

        #divdois {
            position: fixed;

            bottom: 20px;

            left: 50%;

            transform: translateX(-50%);


        }

        #voltar {
            width: 100px;
            height: 40px;
            background-color: #00bfff;
            color: white;
        }

        #voltar:hover {
            background-color: #009acd;
        }

        button {
            width: 100%;
            height: 45px;

            border: none;
            border-radius: 8px;

            background-color: #00bfff;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- TROQUE ESSE GIF PELO SEU -->
        <img
            src="https://uploads-us-west-2.insided.com/figma-en/attachment/7105e9c010b3d1f0ea893ed5ca3bd58e6cec090e.gif">

        <h1>Obrigadoooooooooooo!</h1>

        <p>Você saiu do sistema com sucesso.</p>

    </div>

    <div id="divdois"><button id="voltar" onclick="window.location.href='menu.html'">Voltar</button></div>

</body>

</html>
