<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>

    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #dfefff;

            font-family: Arial, Helvetica, sans-serif;
        }

        #principal {
            background-color: white;

            width: 350px;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 40px;

            margin-top: 5px;
            margin-bottom: 15px;

            border: 1px solid #ccc;
            border-radius: 8px;

            padding-left: 10px;

            box-sizing: border-box;

            font-size: 15px;
        }

        button {
            width: 100%;
            height: 45px;

            border: none;
            border-radius: 8px;

            background-color: #00bfff;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background-color: #009acd;
        }

        /* POPUP TOAST */
        #toast {
            position: fixed;

            bottom: 20px;
            right: 20px;

            padding: 15px 20px;

            border-radius: 10px;

            color: white;

            font-weight: bold;

            opacity: 0;

            transform: translateY(20px);

            transition: 0.4s;

            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .success {
            background: #00c853;
        }

        .error {
            background: #ff3d3d;
        }

        #divdois {
            position: fixed;

            bottom: 20px;

            left: 50%;

            transform: translateX(-50%);


        }

        #voltar {
            width: 100px;
            height: 40px;
            background-color: #00bfff;
            color: white;
        }

        #voltar:hover {
            background-color: #009acd;
        }
    </style>
</head>

<body>

    <div id="principal">

        <h1>Cadastro de Clientes</h1>

        <label>Nome</label>
        <input type="text" id="nome">

        <label>E-mail</label>
        <input type="text" id="email">

        <label>Telefone</label>
        <input type="text" id="telefone">

        <button onclick="cadastrar()">
            Cadastrar
        </button>

    </div>

    <!-- TOAST -->
    <div id="toast"></div>

    <div id="divdois"><button id="voltar" onclick="window.location.href='menu.html'">Voltar</button></div>

                toast.classList.remove("show");
            }, 3000);
        }

        function cadastrar() {

            let nome = document.getElementById("nome").value.trim();
            let email = document.getElementById("email").value.trim();
            let telefone = document.getElementById("telefone").value.trim();

            if (nome.split(" ").length < 2) {
                mostrarToast("Digite nome e sobrenome", "error");
                return;
            }

            if (!email.includes("@") || !email.includes(".")) {
                mostrarToast("Email inválido", "error");

    </script>

</body>

</html>
